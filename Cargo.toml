[package]
name = "envscope"
version = "0.1.0"
edition = "2024"
description = "Check that environment variables used by Python code are documented."
license = "MIT"
repository = "https://github.com/Vansh-738/envscope"
keywords = ["python", "dotenv", "cli", "lint"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-python = "0.25"

[dev-dependencies]
tempfile = "3"
