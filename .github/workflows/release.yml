name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir package
          cp target/${{ matrix.target }}/release/envscope LICENSE README.md package/
          tar -czf envscope-${{ matrix.target }}.tar.gz -C package envscope LICENSE README.md
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/envscope.exe,LICENSE,README.md -DestinationPath envscope-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: envscope-${{ matrix.target }}
          path: |
            envscope-*.tar.gz
            envscope-*.zip
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          (cd dist && sha256sum *) > SHA256SUMS
          mv SHA256SUMS dist/
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --notes 'Check Python environment lookups against .env.example. Includes source locations, JSON reports, blank template generation, and dynamic-key diagnostics. See the README for usage and current limits.'
